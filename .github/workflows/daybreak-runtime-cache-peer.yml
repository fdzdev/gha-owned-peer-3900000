name: Daybreak runtime cache peer

on:
  workflow_dispatch:
  push:
    branches:
      - daybreak-cache-peer

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: ./.github/actions/runtime-cache-publish
      - run: sleep 150
